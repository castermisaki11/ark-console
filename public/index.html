<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARK OPS — Field Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanline" aria-hidden="true"></div>

<header class="topbar">
  <div class="wordmark">
    <span class="wordmark-main">ARK OPS</span>
    <span class="wordmark-sub">FIELD CONSOLE</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="commands" role="tab" aria-selected="true">Commands</button>
    <button class="tab" data-tab="log" role="tab" aria-selected="false">Ops Log</button>
  </nav>
  <div class="status" id="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">connecting</span>
  </div>
</header>

<main class="layout">

  <!-- COMMANDS VIEW -->
  <section class="view is-active" id="view-commands">
    <aside class="rail">
      <div class="rail-block">
        <label class="rail-label" for="search">Search</label>
        <input id="search" class="rail-input" type="text" placeholder="ชื่อ / คำสั่ง / คำอธิบาย" autocomplete="off">
      </div>
      <div class="rail-block">
        <span class="rail-label">Category</span>
        <ul class="cat-list" id="catList">
          <li><button class="cat-item is-active" data-cat="__all">All entries<span class="cat-count" id="countAll">0</span></button></li>
        </ul>
      </div>
      <button class="btn-primary btn-block" id="openAddForm">Add command</button>
    </aside>

    <div class="panel">
      <form class="add-form" id="addForm" hidden>
        <div class="add-form-grid">
          <div class="field">
            <label for="f-category">Category</label>
            <input id="f-category" name="category" type="text" placeholder="e.g. Spawn, Admin, Weather" list="catOptions">
            <datalist id="catOptions"></datalist>
          </div>
          <div class="field">
            <label for="f-name">Name</label>
            <input id="f-name" name="name" type="text" placeholder="ชื่อคำสั่งสั้น ๆ" required>
          </div>
          <div class="field field-wide">
            <label for="f-command">Command</label>
            <input id="f-command" name="command" type="text" class="mono" placeholder="cheat SetTimeOfDay 00:00" required>
          </div>
          <div class="field field-wide">
            <label for="f-description">Description</label>
            <input id="f-description" name="description" type="text" placeholder="ใช้ทำอะไร (ไม่บังคับ)">
          </div>
        </div>
        <div class="add-form-actions">
          <button type="button" class="btn-ghost" id="cancelAdd">Cancel</button>
          <button type="submit" class="btn-primary">Save command</button>
        </div>
      </form>

      <div class="cmd-list" id="cmdList"></div>
      <p class="empty-state" id="cmdEmpty" hidden>ยังไม่มีคำสั่งในหมวดนี้ — เพิ่มคำสั่งแรกได้เลย</p>
    </div>
  </section>

  <!-- LOG VIEW -->
  <section class="view" id="view-log">
    <div class="log-composer">
      <label class="rail-label" for="logText">New entry</label>
      <textarea id="logText" rows="3" placeholder="บันทึกเหตุการณ์ประจำวัน เช่น รีสตาร์ทเซิร์ฟเวอร์ 20:00, ผู้เล่นแจ้งบั๊กจุดสไปน์แร็พเตอร์..."></textarea>
      <div class="log-composer-actions">
        <span class="hint">Enter + Shift ขึ้นบรรทัดใหม่ · Enter บันทึก</span>
        <button class="btn-primary" id="logSubmit">Log entry</button>
      </div>
    </div>

    <div class="ledger" id="ledger"></div>
    <p class="empty-state" id="logEmpty" hidden>ยังไม่มีบันทึก — เริ่มเขียนรายการแรกด้านบน</p>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
