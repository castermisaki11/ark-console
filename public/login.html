<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ARK OPS — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<!--
  Deliberately self-contained (no shared style.css / app.js): this page
  must render correctly for a signed-out visitor, before any protected
  static asset is reachable.
-->
<style>
  :root {
    --bg: #14140e;
    --panel: #1a1a12;
    --border: #38371f;
    --text: #e9e4d2;
    --text-muted: #8c8871;
    --amber: #d4972b;
    --amber-bright: #f0b13f;
    --danger: #b0503a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 36px 28px;
    text-align: center;
  }
  .wordmark-main {
    font-family: 'Oswald', sans-serif;
    font-size: 24px; font-weight: 700; letter-spacing: 0.08em;
  }
  .wordmark-sub {
    font-family: 'Inter', sans-serif;
    font-size: 11px; letter-spacing: 0.22em;
    color: var(--amber); margin-top: 6px; text-transform: uppercase;
  }
  .hint {
    color: var(--text-muted); font-size: 13px;
    margin: 20px 0 28px; line-height: 1.5;
  }
  .discord-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    background: #5865f2; color: #fff;
    border: none; border-radius: 4px;
    padding: 13px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; text-decoration: none;
    transition: background 0.15s ease;
  }
  .discord-btn:hover { background: #4752c4; }
  .discord-btn svg { flex-shrink: 0; }
  .error-msg {
    display: none;
    margin-top: 18px;
    padding: 10px 12px;
    border: 1px solid var(--danger);
    border-radius: 4px;
    color: var(--danger);
    font-size: 13px;
    text-align: left;
  }
  .error-msg.is-shown { display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="wordmark-main">ARK OPS</div>
  <div class="wordmark-sub">FIELD CONSOLE</div>
  <p class="hint">เข้าสู่ระบบด้วยบัญชี Discord ของคุณ<br>เฉพาะแอดมินที่ได้รับอนุญาตเท่านั้น</p>

  <a class="discord-btn" href="/auth/discord">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
    </svg>
    Login with Discord
  </a>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
  // Surface a friendly reason for landing back on /login, if any.
  const messages = {
    denied: 'การเข้าสู่ระบบถูกยกเลิก',
    state: 'เซสชันเข้าสู่ระบบหมดอายุ กรุณาลองใหม่',
    session: 'สร้างเซสชันไม่สำเร็จ กรุณาลองใหม่',
    oauth: 'เข้าสู่ระบบด้วย Discord ไม่สำเร็จ กรุณาลองใหม่'
  };
  const params = new URLSearchParams(window.location.search);
  const err = params.get('error');
  if (err && messages[err]) {
    const box = document.getElementById('errorMsg');
    box.textContent = messages[err];
    box.classList.add('is-shown');
  }
</script>

</body>
</html>
